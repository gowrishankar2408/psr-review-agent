name: Build and publish MCP server

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
            -
                uses: actions/setup-python@v5
                with:
                    python-version: "3.12"
            -
                name: Install dependencies
                run: python -m pip install -r mcp-server/requirements.txt
            -
                name: Compile Python sources
                run: python -m compileall -q mcp-server/src
            -
                name: Build container image
                run: docker build -t psr-review-agent:${{ github.sha }} mcp-server

    publish-ecr:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.ECR_REPOSITORY != ''
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            -
                uses: actions/checkout@v4
            -
                uses: aws-actions/configure-aws-credentials@v4
                with:
                    role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                    aws-region: ${{ vars.AWS_REGION }}
            -
                uses: aws-actions/amazon-ecr-login@v2
                id: login-ecr
            -
                uses: docker/build-push-action@v6
                with:
                    context: ./mcp-server
                    push: true
                    tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
